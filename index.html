<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europa Unentschieden-Scanner</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 15px; background: #f4f6f9; color: #222; }
        h1 { text-align: center; color: #1a202c; }
        .box { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        select, button { padding: 10px 15px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; }
        button { background: #0066cc; color: white; border: none; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #0066cc; color: white; }
        tr:hover { background: #f9fbfd; }
        #status { font-weight: bold; margin-bottom: 15px; text-align: center; color: #0066cc; }
    </style>
</head>
<body>
    <h1>⚽ Europa Unentschieden-Scanner</h1>
    <div class="box">
        <select id="sortierung" onchange="anzeigen()">
            <option value="remis">🏆 Meiste Unentschieden</option>
            <option value="quote">📈 Höchste Remis-Quote (%)</option>
            <option value="null">⚠️ Noch KEIN Remis</option>
        </select>
        <button onclick="ladeDaten()">🔄 Aktualisieren</button>
    </div>
    <div id="status">Lade deine Statistiken...</div>
    <table id="tabelle" style="display:none;">
        <thead><tr><th>#</th><th>Mannschaft</th><th>Liga</th><th>Spiele</th><th>Remis</th><th>Quote</th></tr></thead>
        <tbody id="tbody"></tbody>
    </table>
    <script>
        let alleTeams = [];
        async function ladeDaten() {
            const status = document.getElementById("status");
            try {
                const res = await fetch("./daten.json?t=" + Date.now());
                if (!res.ok) throw new Error();
                alleTeams = await res.json();
                status.textContent = "";
                anzeigen();
            } catch (e) {
                status.style.color = "#d9534f";
                status.textContent = "daten.json konnte nicht geladen werden.";
            }
        }
        function anzeigen() {
            const modus = document.getElementById("sortierung").value;
            let liste = [...alleTeams];
            if (modus === "remis") liste.sort((a, b) => b.remis - a.remis || b.quote - a.quote);
            else if (modus === "quote") liste.sort((a, b) => b.quote - a.quote || b.remis - a.remis);
            else liste = liste.filter(t => t.remis === 0 && t.spiele >= 4).sort((a, b) => b.spiele - a.spiele);
            const tbody = document.getElementById("tbody");
            tbody.innerHTML = "";
            liste.slice(0, 60).forEach((t, idx) => {
                tbody.innerHTML += `<tr><td><strong>${idx + 1}.</strong></td><td>${t.name}</td><td>${t.liga}</td><td>${t.spiele}</td><td><strong>${t.remis}</strong></td><td>${t.quote}%</td></tr>`;
            });
            document.getElementById("tabelle").style.display = "table";
        }
        window.onload = ladeDaten;
    </script>
</body>
</html>
