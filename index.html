<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europa Unentschieden-Scanner (Live)</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 15px; background: #f4f6f9; color: #222; }
        h1 { text-align: center; color: #1a202c; }
        .box { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        select, button { padding: 10px 15px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; }
        button { background: #0066cc; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #004c99; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #0066cc; color: white; }
        tr:hover { background: #f9fbfd; }
        #status { font-weight: bold; margin-bottom: 15px; text-align: center; color: #0066cc; }
    </style>
</head>
<body>

    <h1>⚽ Europa Unentschieden-Scanner (Live)</h1>

    <div class="box">
        <select id="sortierung" onchange="anzeigen()">
            <option value="remis">🏆 Meiste Unentschieden</option>
            <option value="quote">📈 Höchste Remis-Quote (%)</option>
            <option value="null">⚠️ Noch KEIN Remis</option>
        </select>
        <button onclick="ladeDaten()">🔄 Live-Daten laden</button>
    </div>

    <div id="status">Lade aktuelle Tabellen...</div>

    <table id="tabelle" style="display:none;">
        <thead>
            <tr>
                <th>#</th>
                <th>Mannschaft</th>
                <th>Liga</th>
                <th>Spiele</th>
                <th>Remis</th>
                <th>Quote</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>

    <script>
        let alleTeams = [];

        const LIGEN = [
            { name: "🇩🇪 1. Bundesliga", file: "de.1.json" },
            { name: "🇩🇪 2. Bundesliga", file: "de.2.json" },
            { name: "🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League", file: "en.1.json" },
            { name: "🏴󠁧󠁢󠁥󠁮󠁧󠁿 Championship", file: "en.2.json" },
            { name: "🇪🇸 La Liga", file: "es.1.json" },
            { name: "🇮🇹 Serie A", file: "it.1.json" },
            { name: "🇫🇷 Ligue 1", file: "fr.1.json" }
        ];

        async function ladeDaten() {
            const status = document.getElementById("status");
            status.style.color = "#0066cc";
            status.textContent = "Lade aktuelle Saison-Daten...";
            alleTeams = [];

            for (const liga of LIGEN) {
                try {
                    const url = "https://githubusercontent.com" + liga.file;
                    const res = await fetch(url);
                    if (res.ok) {
                        const data = await res.json();
                        const stats = {};
                        (data.matches || []).forEach(m => {
                            if (m.score && Array.isArray(m.score.ft) && m.score.ft.length === 2) {
                                const t1 = m.team1;
                                const t2 = m.team2;
                                if (!stats[t1]) stats[t1] = { spiele: 0, remis: 0 };
                                if (!stats[t2]) stats[t2] = { spiele: 0, remis: 0 };
                                stats[t1].spiele += 1;
                                stats[t2].spiele += 1;
                                if (m.score.ft[0] === m.score.ft[1]) {
                                    stats[t1].remis += 1;
                                    stats[t2].remis += 1;
                                }
                            }
                        });
                        Object.keys(stats).forEach(teamName => {
                            const sp = stats[teamName].spiele;
                            const remis = stats[teamName].remis;
                            alleTeams.push({
                                name: teamName,
                                liga: liga.name,
                                spiele: sp,
                                remis: remis,
                                quote: sp > 0 ? +(remis / sp * 100).toFixed(1) : 0
                            });
                        });
                    }
                } catch (e) {}
            }

            if (alleTeams.length === 0) {
                status.style.color = "#d9534f";
                status.textContent = "Fehler beim Laden der GitHub-Daten.";
            } else {
                status.textContent = "";
                anzeigen();
            }
        }

        function anzeigen() {
            if (alleTeams.length === 0) return;
            const modus = document.getElementById("sortierung").value;
            let liste = [...alleTeams];

            if (modus === "remis") {
                liste.sort((a, b) => b.remis - a.remis || b.quote - a.quote);
            } else if (modus === "quote") {
                liste.sort((a, b) => b.quote - a.quote || b.remis - a.remis);
            } else {
                liste = liste.filter(t => t.remis === 0 && t.spiele >= 4).sort((a, b) => b.spiele - a.spiele);
            }

            const tbody = document.getElementById("tbody");
            tbody.innerHTML = "";
            liste.slice(0, 60).forEach((t, idx) => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${idx + 1}.</strong></td>
                        <td>${t.name}</td>
                        <td>${t.liga}</td>
                        <td>${t.spiele}</td>
                        <td><strong>${t.remis}</strong></td>
                        <td>${t.quote}%</td>
                    </tr>
                `;
            });
            document.getElementById("tabelle").style.display = "table";
        }

        window.onload = ladeDaten;
    </script>
</body>
</html>
