
name: Daten aktualisieren
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lade Ligen
        env:
          TOKEN: ${{ secrets.FOOTBALL_TOKEN }}
        run: python3 update.py
      - name: Speichere daten.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add daten.json
          git commit -m "Update Statistiken" || exit 0
          git push
